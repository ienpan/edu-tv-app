name: Build Edu TV App APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install --ignore-scripts
      
    - name: Build web app
      run: npm run build
      
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install Android SDK components
      run: |
        sdkmanager "platforms;android-33" "build-tools;33.0.0" --sdk_root=${{ runner.temp }}/android-sdk
        
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        export ANDROID_HOME=${{ runner.temp }}/android-sdk
        export JAVA_HOME=$JAVA_HOME_17_X64
        ./gradlew assembleDebug
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        
    - name: Build Release APK
      run: |
        cd android
        export ANDROID_HOME=${{ runner.temp }}/android-sdk
        export JAVA_HOME=$JAVA_HOME_17_X64
        ./gradlew assembleRelease
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
        
    - name: Summary
      if: always()
      run: |
        echo "## 📱 构建结果" >> $GITHUB_STEP_SUMMARY
        if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✅ Debug APK 生成成功" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
          echo "✅ Release APK 生成成功" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📥 下载地址: Actions → Artifacts" >> $GITHUB_STEP_SUMMARY
